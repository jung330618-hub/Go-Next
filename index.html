
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GoNext — 探索地圖</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF4D00; --yellow: #FFD000; --cyan: #00E5FF;
    --dark: #0D0D0D; --card: #181820; --white: #F5F0E8;
    --green: #00FF7F; --pink: #FF2D78;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--dark); font-family:'Noto Sans TC',sans-serif; color:var(--white); }

  .screen { position:absolute; inset:0; transition:opacity .35s, transform .35s; }
  .screen.hidden { opacity:0; pointer-events:none; transform:translateY(24px); }

  /* ── LOADING ── */
  #loading { z-index:200; background:var(--dark); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; transition:opacity .5s; }
  #loading.done { opacity:0; pointer-events:none; }
  .loading-logo { font-family:'Bangers',cursive; font-size:64px; color:var(--yellow); letter-spacing:4px; text-shadow:4px 4px 0 var(--orange); animation:logoPulse 1s ease-in-out infinite alternate; }
  @keyframes logoPulse { from{transform:scale(1)} to{transform:scale(1.05)} }
  .loading-bar { width:160px; height:3px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
  .loading-fill { height:100%; background:linear-gradient(to right,var(--orange),var(--yellow)); width:0; transition:width .4s ease; }
  .loading-text { font-size:13px; color:rgba(245,240,232,.4); letter-spacing:2px; text-transform:uppercase; }

  /* ── MAP SCREEN ── */
  #screen-map { display:flex; flex-direction:column; }
  .topbar { position:relative; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:14px 18px 10px; background:linear-gradient(to bottom,rgba(13,13,13,1),rgba(13,13,13,0)); }
  .logo { font-family:'Bangers',cursive; font-size:28px; color:var(--yellow); letter-spacing:3px; text-shadow:2px 2px 0 var(--orange); }
  .loc-pill { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); padding:6px 14px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; transition:background .2s; }
  .loc-pill:active { background:rgba(255,77,0,.2); }
  .loc-dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:dotPulse 2s infinite; }
  @keyframes dotPulse { 0%,100%{box-shadow:0 0 0 0 rgba(0,255,127,.4)} 50%{box-shadow:0 0 0 6px rgba(0,255,127,0)} }

  /* MAP */
  #map { flex:1; }

  /* BOTTOM SHEET */
  .bottom-sheet { position:absolute; bottom:0; left:0; right:0; z-index:30; background:linear-gradient(to top,var(--dark) 88%,transparent); padding:0 0 22px; }
  .sheet-handle { width:36px; height:3px; border-radius:2px; background:rgba(255,255,255,.2); margin:10px auto 14px; }

  .radius-bar { display:flex; align-items:center; gap:10px; padding:0 18px; margin-bottom:14px; }
  .radius-label { font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:1px; color:rgba(245,240,232,.4); white-space:nowrap; }
  .radius-chips { display:flex; gap:6px; }
  .radius-chip { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700; border:1px solid rgba(255,255,255,.15); cursor:pointer; transition:all .2s; background:transparent; color:rgba(245,240,232,.5); }
  .radius-chip.active { background:var(--orange); border-color:var(--orange); color:#fff; }

  .cat-scroll { overflow-x:auto; padding:0 18px; scrollbar-width:none; }
  .cat-scroll::-webkit-scrollbar { display:none; }
  .cat-row { display:flex; gap:8px; width:max-content; }
  .cat-chip { display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:20px; font-size:13px; font-weight:700; border:1.5px solid rgba(255,255,255,.12); cursor:pointer; transition:all .25s; background:rgba(255,255,255,.04); color:rgba(245,240,232,.65); white-space:nowrap; }
  .cat-chip .cat-count { background:rgba(255,255,255,.15); border-radius:10px; padding:1px 7px; font-size:10px; }
  .cat-chip.active { color:#fff; }
  .cat-chip.active.c-all   { background:var(--orange); border-color:var(--orange); }
  .cat-chip.active.c-food  { background:#FF6B35; border-color:#FF6B35; }
  .cat-chip.active.c-spot  { background:#7C3AED; border-color:#7C3AED; }
  .cat-chip.active.c-cafe  { background:#92400E; border-color:#92400E; }
  .cat-chip.active.c-park  { background:#16A34A; border-color:#16A34A; }
  .cat-chip.active.c-shop  { background:#0369A1; border-color:#0369A1; }

  .start-swipe-btn { margin:14px 18px 0; width:calc(100% - 36px); background:linear-gradient(135deg,var(--orange),#FF8A00); color:#fff; border:none; padding:15px; font-family:'Noto Sans TC'; font-weight:900; font-size:15px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%); transition:opacity .2s; position:relative; }
  .start-swipe-btn:disabled { opacity:.4; }

  /* ── SWIPE SCREEN ── */
  #screen-swipe { display:flex; flex-direction:column; background:var(--dark); }
  .swipe-topbar { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.06); }
  .back-btn { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.08); border:none; color:var(--white); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .swipe-title { flex:1; }
  .swipe-title h2 { font-size:16px; font-weight:900; }
  .swipe-title p { font-size:11px; color:rgba(245,240,232,.4); margin-top:1px; }
  .swipe-count { background:rgba(255,208,0,.15); border:1px solid rgba(255,208,0,.3); padding:4px 12px; border-radius:20px; font-size:12px; font-weight:900; color:var(--yellow); }

  .card-area { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; position:relative; overflow:hidden; }
  .stamp { position:absolute; top:60px; z-index:50; font-family:'Bangers',cursive; font-size:52px; letter-spacing:3px; border:4px solid; border-radius:6px; padding:4px 16px; opacity:0; transition:opacity .15s; pointer-events:none; }
  .stamp-like { left:24px; color:var(--green); border-color:var(--green); transform:rotate(-12deg); }
  .stamp-nope { right:24px; color:var(--pink); border-color:var(--pink); transform:rotate(12deg); }
  .stamp.show { opacity:1; }

  .place-card-wrap { width:100%; max-width:360px; position:relative; }
  .place-card-wrap.swipe-right { animation:swipeRight .4s ease forwards; }
  .place-card-wrap.swipe-left  { animation:swipeLeft .4s ease forwards; }
  @keyframes swipeRight { to{transform:translateX(120%) rotate(20deg);opacity:0} }
  @keyframes swipeLeft  { to{transform:translateX(-120%) rotate(-20deg);opacity:0} }

  .place-card { background:var(--card); border-radius:24px; overflow:hidden; border:1px solid rgba(255,255,255,.08); box-shadow:0 20px 60px rgba(0,0,0,.5); user-select:none; }

  .card-img-area { height:200px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#1e1e2e; }
  .card-img-area img { width:100%; height:100%; object-fit:cover; }
  .card-img-area::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom,transparent 40%,rgba(24,24,32,.95)); }
  .card-img-emoji { font-size:72px; position:absolute; z-index:1; }
  .card-distance-badge { position:absolute; top:12px; right:12px; z-index:3; background:rgba(13,13,13,.8); backdrop-filter:blur(8px); padding:5px 12px; border-radius:20px; font-size:11px; font-weight:900; border:1px solid rgba(255,255,255,.1); }
  .card-type-badge { position:absolute; top:12px; left:12px; z-index:3; padding:5px 12px; border-radius:20px; font-size:11px; font-weight:900; }
  .card-rating { position:absolute; bottom:12px; right:12px; z-index:3; display:flex; align-items:center; gap:4px; font-size:13px; font-weight:900; }
  .card-open-status { position:absolute; bottom:12px; left:12px; z-index:3; font-size:11px; font-weight:700; padding:3px 10px; border-radius:10px; }
  .open { background:rgba(0,255,127,.2); color:var(--green); }
  .closed { background:rgba(255,45,120,.2); color:var(--pink); }

  .card-body { padding:18px 20px 20px; }
  .card-name { font-size:21px; font-weight:900; margin-bottom:4px; line-height:1.2; }
  .card-address { font-size:12px; color:rgba(245,240,232,.45); margin-bottom:12px; }
  .card-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .card-tag { background:rgba(255,255,255,.07); border-radius:6px; padding:4px 10px; font-size:11px; color:rgba(245,240,232,.6); font-weight:700; }
  .card-desc { font-size:13px; color:rgba(245,240,232,.55); line-height:1.6; }
  .card-actions-hint { display:flex; justify-content:space-between; padding:10px 20px 0; font-size:11px; color:rgba(245,240,232,.2); }

  /* Stack bg */
  .card-stack-bg { position:absolute; width:100%; max-width:360px; pointer-events:none; }
  .card-stack-bg.s2 { transform:scale(.95) translateY(10px); z-index:1; opacity:.4; }
  .card-stack-bg.s3 { transform:scale(.9) translateY(20px); z-index:0; opacity:.2; }
  .card-stack-bg .place-card { height:70px; }

  .empty-state { text-align:center; padding:40px 20px; display:none; }
  .empty-state.show { display:block; }
  .empty-icon { font-size:64px; margin-bottom:16px; }
  .empty-title { font-family:'Bangers',cursive; font-size:32px; color:var(--yellow); margin-bottom:8px; letter-spacing:2px; }
  .empty-desc { font-size:14px; color:rgba(245,240,232,.5); line-height:1.6; }
  .empty-restart { margin-top:20px; background:var(--orange); color:#fff; border:none; padding:12px 28px; font-family:'Noto Sans TC'; font-weight:900; font-size:14px; cursor:pointer; clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }

  .liked-bar { position:absolute; bottom:90px; left:18px; right:18px; z-index:40; background:var(--card); border:1px solid rgba(255,208,0,.25); border-radius:16px; padding:12px 16px; display:flex; align-items:center; gap:10px; transform:translateY(120px); transition:transform .3s cubic-bezier(.34,1.56,.64,1); pointer-events:none; }
  .liked-bar.show { transform:translateY(0); pointer-events:all; }
  .liked-bar-text { flex:1; font-size:13px; font-weight:700; }
  .liked-bar-text span { color:var(--yellow); }
  .liked-bar-close { background:none; border:none; color:rgba(245,240,232,.4); font-size:18px; cursor:pointer; }

  .swipe-controls { display:flex; align-items:center; justify-content:center; gap:20px; padding:16px 0 28px; }
  .ctrl-btn { border:none; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s; font-size:24px; }
  .ctrl-btn:active { transform:scale(.88); }
  .ctrl-skip { width:52px; height:52px; background:rgba(255,45,120,.15); color:var(--pink); border:2px solid rgba(255,45,120,.4); }
  .ctrl-info { width:44px; height:44px; background:rgba(255,208,0,.1); color:var(--yellow); border:2px solid rgba(255,208,0,.3); font-size:18px; }
  .ctrl-like { width:64px; height:64px; background:linear-gradient(135deg,rgba(0,255,127,.2),rgba(0,229,255,.1)); color:var(--green); border:2px solid rgba(0,255,127,.5); font-size:28px; }

  /* TOAST */
  .toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(24,24,32,.95); border:1px solid rgba(255,255,255,.1); padding:10px 20px; border-radius:20px; font-size:13px; font-weight:700; z-index:300; opacity:0; transition:all .3s; white-space:nowrap; backdrop-filter:blur(12px); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ERROR */
  .error-box { margin:20px 18px; padding:16px; background:rgba(255,45,120,.1); border:1px solid rgba(255,45,120,.3); border-radius:12px; font-size:13px; color:rgba(245,240,232,.7); line-height:1.6; display:none; }
  .error-box.show { display:block; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="screen" id="loading">
  <div class="loading-logo">GoNext</div>
  <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  <div class="loading-text" id="loading-text">定位中...</div>
</div>

<div class="toast" id="toast"></div>

<!-- ══ SCREEN 1: MAP ══ -->
<div class="screen hidden" id="screen-map">
  <div class="topbar">
    <div class="logo">GoNext</div>
    <div class="loc-pill" onclick="relocate()">
      <div class="loc-dot"></div>
      <span id="loc-text">定位中...</span>
    </div>
  </div>

  <div id="map"></div>

  <div class="bottom-sheet">
    <div class="sheet-handle"></div>

    <div class="radius-bar">
      <span class="radius-label">範圍</span>
      <div class="radius-chips">
        <div class="radius-chip active" onclick="setRadius(this,500)">500m</div>
        <div class="radius-chip" onclick="setRadius(this,1000)">1 km</div>
        <div class="radius-chip" onclick="setRadius(this,2000)">2 km</div>
        <div class="radius-chip" onclick="setRadius(this,3000)">3 km</div>
      </div>
    </div>

    <div class="cat-scroll">
      <div class="cat-row" id="cat-row">
        <div class="cat-chip c-all active" onclick="selectCat(this,'all')">🗺️ 全部 <span class="cat-count" id="cnt-all">-</span></div>
        <div class="cat-chip c-food" onclick="selectCat(this,'food')">🍜 餐廳 <span class="cat-count" id="cnt-food">-</span></div>
        <div class="cat-chip c-spot" onclick="selectCat(this,'spot')">🏛️ 景點 <span class="cat-count" id="cnt-spot">-</span></div>
        <div class="cat-chip c-cafe" onclick="selectCat(this,'cafe')">☕ 咖啡 <span class="cat-count" id="cnt-cafe">-</span></div>
        <div class="cat-chip c-park" onclick="selectCat(this,'park')">🌳 公園 <span class="cat-count" id="cnt-park">-</span></div>
        <div class="cat-chip c-shop" onclick="selectCat(this,'shop')">🛍️ 購物 <span class="cat-count" id="cnt-shop">-</span></div>
      </div>
    </div>

    <div class="error-box" id="error-box"></div>

    <button class="start-swipe-btn" id="start-btn" onclick="startSwipe()" disabled>
      搜尋附近地點中...
    </button>
  </div>
</div>

<!-- ══ SCREEN 2: SWIPE ══ -->
<div class="screen hidden" id="screen-swipe">
  <div class="swipe-topbar">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="swipe-title">
      <h2 id="swipe-cat-label">全部地點</h2>
      <p id="swipe-cat-sub">附近 500m</p>
    </div>
    <div class="swipe-count" id="swipe-count">1 / ?</div>
  </div>

  <div class="card-area" id="card-area">
    <div class="stamp stamp-like" id="stamp-like">NICE!</div>
    <div class="stamp stamp-nope" id="stamp-nope">NOPE</div>

    <div class="card-stack-bg s3" id="card-bg3"><div class="place-card"></div></div>
    <div class="card-stack-bg s2" id="card-bg2"><div class="place-card"></div></div>

    <div class="place-card-wrap" id="card-wrap">
      <div class="place-card" id="main-card">
        <div class="card-img-area" id="card-img-area">
          <span class="card-img-emoji" id="card-emoji">🏛️</span>
          <div class="card-distance-badge" id="card-dist">📍 --m</div>
          <div class="card-type-badge" id="card-type-badge">景點</div>
          <div class="card-rating" id="card-rating">⭐ --</div>
          <div class="card-open-status" id="card-open"></div>
        </div>
        <div class="card-body">
          <div class="card-name" id="card-name">載入中...</div>
          <div class="card-address" id="card-addr"></div>
          <div class="card-tags" id="card-tags"></div>
          <div class="card-desc" id="card-desc"></div>
        </div>
        <div class="card-actions-hint"><span>← 左滑：跳過</span><span>右滑：想去 →</span></div>
      </div>
    </div>

    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🎉</div>
      <div class="empty-title">全部看完了！</div>
      <div class="empty-desc">已滑完這個分類的所有地點<br>喜歡的都加入冒險清單了</div>
      <button class="empty-restart" onclick="restartSwipe()">再看一遍</button>
    </div>
  </div>

  <div class="liked-bar" id="liked-bar">
    <div style="font-size:22px">♥</div>
    <div class="liked-bar-text">已加入冒險清單！<br><span id="liked-name"></span></div>
    <button class="liked-bar-close" onclick="closeLikedBar()">✕</button>
  </div>

  <div class="swipe-controls">
    <button class="ctrl-btn ctrl-skip" onclick="doSwipe('left')">✕</button>
    <button class="ctrl-btn ctrl-info" onclick="openGoogleMaps()">ℹ</button>
    <button class="ctrl-btn ctrl-like" onclick="doSwipe('right')">♥</button>
  </div>
</div>

<!-- ══ GOOGLE MAPS + PLACES ══ -->
<script>
const API_KEY = 'AIzaSyC3VPToPUjgM25tzfvPtfGjzhbvFZlzb30';

// ─── STATE ───
let map, userLat, userLng, currentRadius = 500, currentCat = 'all';
let allPlaces = [], catPlaces = {all:[], food:[], spot:[], cafe:[], park:[], shop:[]};
let swipeList = [], swipeIdx = 0, likedList = [];
let isAnimating = false, dragStartX = 0, isDragging = false;
let markers = [], likedBarTimer, toastTimer;
let placesService, geocoder;

const CAT_LABELS = { all:'全部地點', food:'附近餐廳', spot:'周邊景點', cafe:'咖啡廳', park:'公園綠地', shop:'購物' };
const CAT_TYPES  = {
  food: ['restaurant','food','meal_takeaway','meal_delivery','bakery'],
  spot: ['tourist_attraction','museum','art_gallery','church','hindu_temple','place_of_worship','stadium','amusement_park','zoo','aquarium'],
  cafe: ['cafe','bar','night_club'],
  park: ['park','natural_feature'],
  shop: ['shopping_mall','department_store','store','supermarket','clothing_store','book_store']
};
const TYPE_EMOJI = {
  restaurant:'🍜', food:'🍱', cafe:'☕', bar:'🍺', park:'🌳', museum:'🏛️',
  tourist_attraction:'📸', shopping_mall:'🛍️', store:'🏪', book_store:'📚',
  art_gallery:'🎨', night_club:'🎵', default:'📍'
};
const TYPE_LABEL = {
  restaurant:'餐廳', food:'美食', cafe:'咖啡廳', bar:'酒吧', park:'公園',
  museum:'博物館', tourist_attraction:'景點', shopping_mall:'購物中心',
  store:'商店', book_store:'書店', art_gallery:'藝廊', night_club:'夜店',
  meal_takeaway:'外帶', bakery:'麵包', default:'地點'
};
const TYPE_COLOR = {
  restaurant:'rgba(255,107,53,.85)', food:'rgba(255,107,53,.85)',
  cafe:'rgba(146,64,14,.85)', bar:'rgba(157,23,77,.85)',
  park:'rgba(22,163,74,.85)', museum:'rgba(124,58,237,.85)',
  tourist_attraction:'rgba(124,58,237,.85)', shopping_mall:'rgba(3,105,161,.85)',
  default:'rgba(255,77,0,.85)'
};

// ─── LOADING PROGRESS ───
let loadProgress = 0;
function setLoadProgress(pct, text) {
  loadProgress = pct;
  document.getElementById('loading-fill').style.width = pct + '%';
  if (text) document.getElementById('loading-text').textContent = text;
}

// ─── INIT ───
function initApp() {
  setLoadProgress(20, '取得位置...');
  if (!navigator.geolocation) {
    useFallbackLocation();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      setLoadProgress(45, '載入地圖...');
      initMap();
    },
    () => useFallbackLocation(),
    { timeout: 8000, enableHighAccuracy: true }
  );
}

function useFallbackLocation() {
  // 台中市西區（草悟道附近）
  userLat = 24.1477; userLng = 120.6736;
  setLoadProgress(45, '載入地圖（預設台中）...');
  initMap();
}

function initMap() {
  const mapStyle = [
    {elementType:'geometry',stylers:[{color:'#1a2030'}]},
    {elementType:'labels.text.stroke',stylers:[{color:'#1a2030'}]},
    {elementType:'labels.text.fill',stylers:[{color:'#8a9bb0'}]},
    {featureType:'road',elementType:'geometry',stylers:[{color:'#2a3040'}]},
    {featureType:'road',elementType:'geometry.stroke',stylers:[{color:'#1a2030'}]},
    {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#3a4555'}]},
    {featureType:'water',elementType:'geometry',stylers:[{color:'#0d1520'}]},
    {featureType:'poi.park',elementType:'geometry',stylers:[{color:'#1a2815'}]},
    {featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]},
    {featureType:'transit',stylers:[{visibility:'off'}]},
    {featureType:'administrative',elementType:'geometry.stroke',stylers:[{color:'#2a3555'}]},
  ];

  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: userLat, lng: userLng },
    zoom: 15,
    styles: mapStyle,
    disableDefaultUI: true,
    zoomControl: false,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false,
  });

  // User marker
  new google.maps.Marker({
    position: { lat: userLat, lng: userLng },
    map,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 10,
      fillColor: '#00E5FF',
      fillOpacity: 1,
      strokeColor: '#fff',
      strokeWeight: 3,
    },
    zIndex: 999,
  });

  placesService = new google.maps.places.PlacesService(map);
  geocoder = new google.maps.Geocoder();

  // Reverse geocode for display
  geocoder.geocode({ location: { lat: userLat, lng: userLng } }, (results) => {
    if (results && results[0]) {
      const comps = results[0].address_components;
      const district = comps.find(c => c.types.includes('administrative_area_level_3') || c.types.includes('sublocality_level_1'));
      const city = comps.find(c => c.types.includes('administrative_area_level_2'));
      let label = '';
      if (city) label += city.short_name;
      if (district) label += district.short_name;
      document.getElementById('loc-text').textContent = label || '目前位置';
    }
  });

  setLoadProgress(65, '搜尋附近地點...');
  fetchAllPlaces();
}

// ─── PLACES FETCH ───
function fetchAllPlaces() {
  const typeGroups = [
    { key:'food',  types:['restaurant','cafe','bakery','food'] },
    { key:'spot',  types:['tourist_attraction','museum','art_gallery'] },
    { key:'park',  types:['park'] },
    { key:'shop',  types:['shopping_mall','department_store','book_store'] },
  ];

  let done = 0;
  const total = typeGroups.length;

  catPlaces = { all:[], food:[], spot:[], cafe:[], park:[], shop:[] };

  typeGroups.forEach(group => {
    // Use nearbySearch for each type group
    const req = {
      location: new google.maps.LatLng(userLat, userLng),
      radius: currentRadius,
      type: group.types[0],
    };
    placesService.nearbySearch(req, (results, status) => {
      if (status === google.maps.places.PlacesServiceStatus.OK && results) {
        results.forEach(place => {
          const p = parsePlaceResult(place);
          // Deduplicate by place_id
          if (!allPlaces.find(x => x.id === p.id)) {
            allPlaces.push(p);
            catPlaces.all.push(p);
          }
          // Assign category
          const cat = getCatForPlace(place);
          if (cat && !catPlaces[cat].find(x => x.id === p.id)) {
            catPlaces[cat].push(p);
          }
          // Cafe check
          if ((place.types||[]).some(t => ['cafe','bar','bakery'].includes(t))) {
            if (!catPlaces.cafe.find(x => x.id === p.id)) catPlaces.cafe.push(p);
          }
        });
      }
      done++;
      setLoadProgress(65 + Math.round((done/total)*30), '整理地點資料...');
      if (done === total) finishLoading();
    });
  });
}

function getCatForPlace(place) {
  const types = place.types || [];
  if (types.some(t => CAT_TYPES.food.includes(t))) return 'food';
  if (types.some(t => CAT_TYPES.spot.includes(t))) return 'spot';
  if (types.some(t => CAT_TYPES.park.includes(t))) return 'park';
  if (types.some(t => CAT_TYPES.shop.includes(t))) return 'shop';
  return null;
}

function parsePlaceResult(place) {
  const types = place.types || [];
  const mainType = types.find(t => TYPE_EMOJI[t]) || 'default';
  const dist = userLat && userLng ? Math.round(
    google.maps.geometry.spherical.computeDistanceBetween(
      new google.maps.LatLng(userLat, userLng),
      place.geometry.location
    )
  ) : null;

  let photoUrl = null;
  if (place.photos && place.photos.length > 0) {
    try { photoUrl = place.photos[0].getUrl({ maxWidth: 600, maxHeight: 400 }); } catch(e) {}
  }

  return {
    id: place.place_id,
    name: place.name,
    addr: place.vicinity || '',
    emoji: TYPE_EMOJI[mainType] || TYPE_EMOJI.default,
    type: mainType,
    typeLabel: TYPE_LABEL[mainType] || TYPE_LABEL.default,
    typeBg: TYPE_COLOR[mainType] || TYPE_COLOR.default,
    dist: dist,
    rating: place.rating || null,
    openNow: place.opening_hours ? place.opening_hours.open_now : null,
    tags: buildTags(place),
    photoUrl,
    placeId: place.place_id,
    lat: place.geometry.location.lat(),
    lng: place.geometry.location.lng(),
  };
}

function buildTags(place) {
  const tags = [];
  const types = place.types || [];
  if (types.includes('tourist_attraction')) tags.push('觀光景點');
  if (types.includes('museum')) tags.push('博物館');
  if (types.includes('park')) tags.push('公園綠地');
  if (types.includes('restaurant')) tags.push('在地美食');
  if (types.includes('cafe')) tags.push('咖啡廳');
  if (types.includes('bar')) tags.push('酒吧');
  if (place.price_level === 0 || place.price_level === 1) tags.push('平價');
  if (place.price_level >= 3) tags.push('高檔');
  if ((place.rating||0) >= 4.5) tags.push('⭐ 高評價');
  if ((place.user_ratings_total||0) > 500) tags.push('熱門');
  return tags.slice(0, 4);
}

function finishLoading() {
  // Update counts
  updateCounts();
  // Render markers
  renderMarkers('all');
  setLoadProgress(100, '完成！');

  setTimeout(() => {
    document.getElementById('loading').classList.add('done');
    showScreen('screen-map');
    const btn = document.getElementById('start-btn');
    btn.disabled = false;
    btn.textContent = `右滑探索附近地點 (${catPlaces.all.length}個) →`;
  }, 500);
}

function updateCounts() {
  document.getElementById('cnt-all').textContent  = catPlaces.all.length;
  document.getElementById('cnt-food').textContent = catPlaces.food.length;
  document.getElementById('cnt-spot').textContent = catPlaces.spot.length;
  document.getElementById('cnt-cafe').textContent = catPlaces.cafe.length;
  document.getElementById('cnt-park').textContent = catPlaces.park.length;
  document.getElementById('cnt-shop').textContent = catPlaces.shop.length;
}

// ─── MARKERS ───
function renderMarkers(cat) {
  markers.forEach(m => m.setMap(null));
  markers = [];
  const places = catPlaces[cat] || catPlaces.all;
  places.forEach(p => {
    const marker = new google.maps.Marker({
      position: { lat: p.lat, lng: p.lng },
      map,
      title: p.name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 8,
        fillColor: '#FF4D00',
        fillOpacity: 0.9,
        strokeColor: '#FFD000',
        strokeWeight: 2,
      },
      animation: google.maps.Animation.DROP,
    });
    marker.addListener('click', () => showToast('📍 ' + p.name + (p.dist ? ' · ' + p.dist + 'm' : '')));
    markers.push(marker);
  });
}

// ─── MAP CONTROLS ───
function setRadius(el, val) {
  document.querySelectorAll('.radius-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentRadius = val;
  allPlaces = [];
  catPlaces = { all:[], food:[], spot:[], cafe:[], park:[], shop:[] };
  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = '重新搜尋中...';
  showToast('🔍 搜尋 ' + el.textContent + ' 內的地點...');
  fetchAllPlaces();
}

function selectCat(el, cat) {
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentCat = cat;
  renderMarkers(cat);
  const count = (catPlaces[cat]||[]).length;
  document.getElementById('start-btn').textContent = `右滑探索 ${CAT_LABELS[cat]} (${count}個) →`;
  document.getElementById('start-btn').disabled = count === 0;
}

function relocate() {
  showToast('🔄 重新定位中...');
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    map.panTo({ lat: userLat, lng: userLng });
    showToast('✅ 定位更新成功');
  }, () => showToast('❌ 定位失敗，請確認權限'));
}

// ─── SWIPE SCREEN ───
function startSwipe() {
  const list = catPlaces[currentCat] || catPlaces.all;
  if (!list.length) { showToast('此分類目前沒有地點'); return; }
  swipeList = [...list].sort((a,b) => (a.dist||9999) - (b.dist||9999));
  swipeIdx = 0;
  likedList = [];
  document.getElementById('swipe-cat-label').textContent = CAT_LABELS[currentCat];
  document.getElementById('swipe-cat-sub').textContent = '附近 ' + (currentRadius >= 1000 ? currentRadius/1000 + 'km' : currentRadius + 'm');
  showScreen('screen-swipe');
  renderCard();
  setupDrag();
}

function goBack() { showScreen('screen-map'); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function renderCard() {
  if (swipeIdx >= swipeList.length) {
    document.getElementById('card-wrap').style.display = 'none';
    document.getElementById('card-bg2').style.display = 'none';
    document.getElementById('card-bg3').style.display = 'none';
    document.getElementById('empty-state').classList.add('show');
    document.getElementById('swipe-count').textContent = '完成！';
    return;
  }
  document.getElementById('card-wrap').style.display = '';
  document.getElementById('card-bg2').style.display = '';
  document.getElementById('card-bg3').style.display = '';
  document.getElementById('empty-state').classList.remove('show');

  const p = swipeList[swipeIdx];

  // Photo or emoji fallback
  const imgArea = document.getElementById('card-img-area');
  const emojiEl = document.getElementById('card-emoji');
  const existImg = imgArea.querySelector('img');
  if (existImg) existImg.remove();

  if (p.photoUrl) {
    const img = document.createElement('img');
    img.src = p.photoUrl;
    img.onerror = () => img.remove();
    imgArea.insertBefore(img, imgArea.firstChild);
    emojiEl.style.display = 'none';
  } else {
    emojiEl.style.display = '';
    emojiEl.textContent = p.emoji;
  }

  document.getElementById('card-name').textContent = p.name;
  document.getElementById('card-addr').textContent = '📍 ' + p.addr;
  document.getElementById('card-dist').textContent = p.dist ? '📍 ' + p.dist + 'm' : '📍 附近';
  document.getElementById('card-rating').textContent = p.rating ? '⭐ ' + p.rating : '';
  document.getElementById('card-type-badge').textContent = p.typeLabel;
  document.getElementById('card-type-badge').style.background = p.typeBg;

  const openEl = document.getElementById('card-open');
  if (p.openNow === true)  { openEl.textContent = '● 營業中'; openEl.className = 'card-open-status open'; }
  else if (p.openNow === false) { openEl.textContent = '● 已休息'; openEl.className = 'card-open-status closed'; }
  else { openEl.textContent = ''; }

  const tagsEl = document.getElementById('card-tags');
  tagsEl.innerHTML = p.tags.map(t => `<span class="card-tag">${t}</span>`).join('');

  document.getElementById('card-desc').textContent = p.addr;
  document.getElementById('swipe-count').textContent = (swipeIdx+1) + ' / ' + swipeList.length;

  const wrap = document.getElementById('card-wrap');
  wrap.className = 'place-card-wrap';
  void wrap.offsetWidth;
  isAnimating = false;
}

function doSwipe(dir) {
  if (isAnimating || swipeIdx >= swipeList.length) return;
  isAnimating = true;
  const p = swipeList[swipeIdx];
  const wrap = document.getElementById('card-wrap');
  hideStamps();
  if (dir === 'right') {
    likedList.push(p);
    wrap.classList.add('swipe-right');
    showLikedBar(p.name);
  } else {
    wrap.classList.add('swipe-left');
  }
  setTimeout(() => { swipeIdx++; renderCard(); }, 380);
}

function openGoogleMaps() {
  if (swipeIdx >= swipeList.length) return;
  const p = swipeList[swipeIdx];
  window.open(`https://www.google.com/maps/place/?q=place_id:${p.placeId}`, '_blank');
}

function restartSwipe() { swipeIdx = 0; renderCard(); }

// ─── DRAG ───
let dragSetup = false;
function setupDrag() {
  if (dragSetup) return;
  dragSetup = true;
  const wrap = document.getElementById('card-wrap');

  wrap.addEventListener('touchstart', e => {
    dragStartX = e.touches[0].clientX; isDragging = true;
  }, {passive:true});
  wrap.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - dragStartX;
    const card = document.getElementById('main-card');
    card.style.transition = 'none';
    card.style.transform = `rotate(${dx*.04}deg) translateX(${dx*.3}px)`;
    if (dx > 40) showLike(); else if (dx < -40) showNope(); else hideStamps();
  }, {passive:true});
  wrap.addEventListener('touchend', e => {
    if (!isDragging) return; isDragging = false;
    const dx = e.changedTouches[0].clientX - dragStartX;
    const card = document.getElementById('main-card');
    card.style.transform = ''; card.style.transition = '';
    hideStamps();
    if (dx > 80) doSwipe('right'); else if (dx < -80) doSwipe('left');
  });

  wrap.addEventListener('mousedown', e => { dragStartX = e.clientX; isDragging = true; });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const card = document.getElementById('main-card');
    card.style.transition = 'none';
    card.style.transform = `rotate(${dx*.04}deg) translateX(${dx*.3}px)`;
    if (dx > 40) showLike(); else if (dx < -40) showNope(); else hideStamps();
  });
  document.addEventListener('mouseup', e => {
    if (!isDragging) return; isDragging = false;
    const dx = e.clientX - dragStartX;
    const card = document.getElementById('main-card');
    card.style.transform = ''; card.style.transition = '';
    hideStamps();
    if (dx > 80) doSwipe('right'); else if (dx < -80) doSwipe('left');
  });
}

// ─── UI HELPERS ───
function showLike() { document.getElementById('stamp-like').classList.add('show'); }
function showNope() { document.getElementById('stamp-nope').classList.add('show'); }
function hideStamps() {
  document.getElementById('stamp-like').classList.remove('show');
  document.getElementById('stamp-nope').classList.remove('show');
}
function showLikedBar(name) {
  document.getElementById('liked-name').textContent = name;
  const bar = document.getElementById('liked-bar');
  bar.classList.add('show');
  clearTimeout(likedBarTimer);
  likedBarTimer = setTimeout(() => bar.classList.remove('show'), 2500);
}
function closeLikedBar() { document.getElementById('liked-bar').classList.remove('show'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
